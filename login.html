<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ODDNEX - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05070a;
      --card-bg: #0b111a;
      --accent-blue: #1e90ff;
      --text-gray: #94a3b8;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 50%, #101e4a, transparent);
      color: white;
      font-family: 'Inter', sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .login-container {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .logo-login {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .logo-login span { color: var(--accent-blue); }

    p { color: var(--text-gray); margin-bottom: 30px; font-size: 14px; }

    .input-group { text-align: left; margin-bottom: 20px; }

    label { display: block; font-size: 12px; color: var(--accent-blue); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; }

    input {
      width: 100%;
      padding: 12px 15px;
      background: #0d1117;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      outline: none;
      transition: 0.3s;
    }

    input:focus { border-color: var(--accent-blue); box-shadow: 0 0 10px rgba(30, 144, 255, 0.2); }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1e90ff, #0066ff);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(30, 144, 255, 0.4); }

    .back-link { display: block; margin-top: 25px; color: var(--text-gray); text-decoration: none; font-size: 13px; }
    .back-link:hover { color: white; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-login">ODD<span>NEX</span></div>
    <p>Insira suas credenciais para acessar o painel de inteligência.</p>

    <form onsubmit="event.preventDefault(); window.location.href='painel.html';">
      <div class="input-group">
        <label>Usuário ou E-mail</label>
        <input type="text" placeholder="seu@email.com" required>
      </div>

      <div class="input-group">
        <label>Senha de Acesso</label>
        <input type="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login">ACESSAR SISTEMA</button>
    </form>

    <a href="index.html" class="back-link">← Voltar para a página inicial</a>
  </div>

</body>
</html>
